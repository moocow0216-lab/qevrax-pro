<style>
:root{
  --void:#050607; --plate:#0c0e11; --plate2:#12151a; --edge:#1d2127; --edge2:#2a2f37;
  --ink:#ebe7df; --steel:#a3a8b0; --dim:#6b717b;
  --gold:#c9a55a; --gold2:#e8cf8f; --gold-soft:rgba(201,165,90,.14);
  --up:#26a69a; --dn:#ef5350; --info:#7aa2ff;
  /* 給原本圖表模組用的變數 */
  --bg:var(--void); --panel:var(--plate2); --panel2:#181c22; --muted:var(--steel); --faint:var(--dim); --line:var(--edge2); --accent:var(--gold);
  --red:var(--dn); --green:var(--up);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--void);color:var(--ink);font:13px/1.45 "IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{border:1px solid var(--edge2);background:var(--panel2);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#16120a;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.tlsub{display:block;font-size:12px;color:var(--steel);line-height:1.6}
.qy{color:var(--gold2)}

/* ---------- 頂列 ---------- */
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:14px;height:48px;padding:0 12px 0 14px;border-bottom:1px solid var(--edge);background:linear-gradient(180deg,#0b0c0f,#060708);flex:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg,.brand img{width:30px;height:30px;flex:none;border-radius:6px}
.brand .wm{font-family:Michroma,"IBM Plex Sans",sans-serif;font-size:14px;letter-spacing:.3em;background:linear-gradient(180deg,#f4f1ea 10%,#9da1a8 70%,#d9bd7a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .pro{font-family:Michroma,sans-serif;font-size:9.5px;letter-spacing:.18em;color:var(--gold2);border:1px solid rgba(201,165,90,.55);padding:2px 6px 1px 7px;border-radius:3px;margin-left:-2px}
.tick{position:relative;display:flex;align-items:baseline;gap:10px;border-left:1px solid var(--edge);padding-left:14px;min-width:0}
.tick button{border:1px solid transparent!important;border-radius:6px;padding:3px 8px!important;margin-left:-8px}.tick button:hover{border-color:var(--edge2)!important;background:var(--plate2)}
.tick .car{font-style:normal;color:var(--gold);font-size:11px;margin-left:6px}
.tick .klpick{position:absolute;z-index:60;width:min(420px,92vw);max-height:min(70vh,560px)}
/* 四格固定同一個幣：圖表格子裡不另外選幣，只選週期 */
.kmsym,#klSymBtn{display:none!important}
.tick button{border:0;background:none;padding:0;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink)}
.tick button span{color:var(--dim);font-weight:400;font-size:12px;margin-left:4px}
.tick .px{font-size:15px;font-weight:600}
.tick .ch{font-size:12.5px}
.tick small{color:var(--dim);font-size:11.5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.bxst{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--steel)}
.bxst i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.bxst[data-s="ok"] i{background:var(--up);box-shadow:0 0 0 3px rgba(38,166,154,.18)}
.bxst[data-s="err"] i{background:var(--dn)}
.bxst[data-s="lock"] i{background:var(--gold)}
.barbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--edge2);background:transparent;border-radius:6px;height:32px;padding:0 12px;cursor:pointer;color:var(--ink)}
.barbtn:hover{border-color:var(--gold)}
.barbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold2)}
.barbtn svg{width:16px;height:16px}

/* ---------- 四格版面＋下單欄 ---------- */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px}
.pane{position:relative;min-width:0;min-height:0;background:var(--plate);border:1px solid var(--edge);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
#paneCharts{grid-column:1;grid-row:1 / span 2;padding:6px 6px 6px 4px}
#paneHeat{grid-column:2;grid-row:1}
#paneLiq{grid-column:2;grid-row:2}
#dock{grid-column:3;grid-row:1 / span 2;width:318px}
.phead{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border-bottom:1px solid var(--edge);flex:none;white-space:nowrap;overflow-x:auto;scrollbar-width:none}.phead::-webkit-scrollbar{display:none}.phead>*{flex:none}.phead .note{flex:0 1 auto;min-width:0}
.phead h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.phead .note{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--plate);padding:3px 8px;font-size:12px;color:var(--steel);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold2);font-weight:600}
.sel{background:var(--plate);border:1px solid var(--edge2);border-radius:6px;padding:2px 6px;font-size:12px;color:var(--steel);height:24px}
.ibtn{border:1px solid var(--edge2);background:transparent;border-radius:6px;height:24px;min-width:24px;padding:0 7px;font-size:12px;color:var(--steel);cursor:pointer}
.ibtn:hover{color:var(--ink);border-color:var(--gold)}
.pbody{position:relative;flex:1;min-height:0}
.pbody canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;pointer-events:none;text-align:center;padding:20px}

/* 原本的 K 線模組放進左邊這一格 */
#mnpKline{flex:1;min-height:0;display:flex;flex-direction:column}
#mnpKline .kl{height:100%;min-height:0;flex:1}
#klLayBtn,#klLockBtn{display:none!important}

/* 清算即時列表 */
.lqfeed{position:absolute;left:66px;top:52px;display:flex;flex-direction:column;gap:2px;pointer-events:none;font-size:11px;max-width:60%}
.lqfeed div{background:rgba(5,6,7,.78);border:1px solid var(--edge);border-radius:4px;padding:1px 7px;white-space:nowrap;animation:lqin .4s ease-out}
@keyframes lqin{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.lqfeed div{animation:none}}

/* ---------- 下單欄 ---------- */
#dock{display:flex;flex-direction:column}
#dock[hidden]{display:none!important}
.dk{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px}
.acct{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
